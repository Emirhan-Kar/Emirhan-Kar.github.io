<style>
:root{
  --bg:#F3EDE2; --card:#EAE2D4; --text:#2A2420; --muted:#7A6E63; --accent:#A0522D;
  --line:rgba(42,36,32,.14);
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--accent);color:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}

/* nav */
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
nav .wrap{display:flex;justify-content:flex-end;align-items:center;height:68px}
.nav-links{display:flex;gap:26px;font-size:15px}
.nav-links a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--text)}

/* hero */
.hero{padding:110px 0 100px}
.avatar{width:140px;height:140px;border-radius:50%;margin-bottom:34px;object-fit:cover;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);font-family:var(--serif);font-size:40px;color:var(--accent)}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(44px,8vw,80px);line-height:1.05;letter-spacing:-1.5px}
.hero h1 em{font-style:italic;color:var(--accent)}
.role{margin-top:22px;font-size:15px;color:var(--muted)}
.hero p.desc{margin-top:22px;max-width:600px;font-size:19px}
.btns{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
.btn{display:inline-block;font-size:15px;font-weight:500;text-decoration:none;padding:11px 22px;border-radius:40px;border:1px solid var(--text);transition:.2s}
.btn.dark{background:var(--text);color:var(--bg)}
.btn.dark:hover{background:var(--accent);border-color:var(--accent)}
.btn:not(.dark):hover{background:var(--card)}
.hero .wrap{display:grid;grid-template-columns:1fr auto;gap:40px}
.hero-socials{display:flex;flex-direction:column;gap:12px;align-self:center;align-items:center}
.hero-socials::before,.hero-socials::after{content:"";width:1px;height:36px;background:var(--line)}
.icon-link{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color .2s,border-color .2s,transform .2s}
.icon-link:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-2px)}
.icon-link svg,.socials svg{width:18px;height:18px}

/* sections */
section{padding:70px 0;border-top:1px solid var(--line)}
.sec-grid{display:grid;grid-template-columns:180px 1fr;gap:40px}
h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.3}
.about p{margin-bottom:18px}
blockquote{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.5;color:var(--accent);margin-top:28px;padding-left:20px;border-left:2px solid var(--accent)}

/* project carousel */
#projeler{overflow:hidden}
.carousel-head{text-align:center;margin-bottom:40px}
.carousel{position:relative;max-width:1180px;margin:0 auto;padding:0 24px}
.stage{position:relative;height:520px;transition:height .4s ease}
.pcard{position:absolute;top:0;left:50%;width:min(560px,78%);background:var(--card);border-radius:12px;padding:34px;
  box-shadow:0 20px 50px -24px rgba(42,36,32,.35);
  transition:transform .6s cubic-bezier(.22,.8,.2,1),filter .6s ease,opacity .6s ease;transform-origin:center top}
.pcard.side{cursor:pointer}
.pcard.side *{pointer-events:none}
.pcard.hidden{pointer-events:none}
.badge{display:inline-block;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:30px;padding:2px 12px;margin-bottom:16px}
.pcard h3{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.2}
.pcard .tagline{color:var(--muted);margin-bottom:16px}
.pcard .tech{margin-top:18px}
.pcard .tech span{background:var(--bg)}
.layers-title{font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{font-family:var(--sans);font-size:14px;padding:6px 14px;border-radius:30px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;transition:.2s}
.layer:hover{border-color:var(--text)}
.layer.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.layer-detail{margin-top:16px;color:var(--muted);min-height:56px}
.pcard .more{display:inline-block;margin-top:18px;color:var(--accent);font-weight:500}
.arrow-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:20;width:48px;height:48px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px -8px rgba(42,36,32,.3);transition:background .2s,color .2s,border-color .2s}
.arrow-btn:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
.arrow-btn.prev{left:24px}.arrow-btn.next{right:24px}
.arrow-btn svg{width:20px;height:20px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:26px}
.dots button{width:8px;height:8px;border-radius:8px;border:0;background:var(--line);cursor:pointer;transition:width .3s,background .3s;padding:0}
.dots button.on{width:24px;background:var(--accent)}

.tech{display:flex;gap:8px;flex-wrap:wrap}
.tech span{font-size:13px;color:var(--muted);background:var(--card);border-radius:4px;padding:2px 10px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 40px}
.skills h5{font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.skills li{list-style:none;padding:4px 0}

/* contact */
.contact h2{font-size:clamp(32px,5vw,48px);line-height:1.15;margin-bottom:14px}
.contact p{color:var(--muted);margin-bottom:28px}
.email{font-family:var(--serif);font-size:clamp(22px,4vw,30px);color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
.socials{display:flex;gap:24px;margin-top:30px}
.socials a{text-decoration:none;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.socials a:hover{color:var(--text)}
footer{padding:40px 0 50px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}

/* gentle fade-in on scroll */
.fade{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
.fade.in{opacity:1;transform:none}

@media (max-width:720px){
  body{font-size:16px}
  .nav-links{gap:16px;font-size:14px}
  .nav-links a:nth-child(3){display:none}
  .hero{padding:70px 0}
  .avatar{width:110px;height:110px;font-size:34px}
  .hero .wrap{grid-template-columns:1fr}
  .hero-socials{flex-direction:row;align-self:start}
  .hero-socials::before,.hero-socials::after{display:none}
  .sec-grid{grid-template-columns:1fr;gap:20px}
  .pcard{width:84%;padding:24px}
  .pcard h3{font-size:26px}
  .arrow-btn{width:40px;height:40px;top:auto;bottom:-62px;transform:none}
  .arrow-btn.prev{left:calc(50% - 110px)}.arrow-btn.next{right:calc(50% - 110px)}
  .dots{margin-top:40px}
  .skills{grid-template-columns:1fr}
}
</style>
</head>

      <h1 class="fade">${H.greeting} <em>${H.name}</em></h1>
      <div class="role fade">${H.role}</div>
      <p class="desc fade">${H.description}</p>
      <div class="btns fade">
        <a class="btn dark" href="${H.primaryButton.link}">${H.primaryButton.text}</a>
        <a class="btn" href="${H.secondaryButton.link}">${H.secondaryButton.text}</a>
      </div>
  </div>
  <div class="hero-socials fade">${C.links.map(l=>`<a class="icon-link" ${ext(l.url)} aria-label="${l.text}" title="${l.text}">${ICONS[l.icon]||''}</a>`).join('')}</div>
</div></header>

<section id="hakkimda"><div class="wrap sec-grid fade">
  <h2>${A.title}</h2>
  <div class="about">${A.paragraphs.map(p=>`<p>${p}</p>`).join('')}${A.quote ? `<blockquote>“${A.quote}”</blockquote>` : ''}</div>
</div></section>

<section id="projeler"><div class="fade">
  <div class="wrap carousel-head"><h2>${P.title}</h2></div>
  <div class="carousel">
    <button class="arrow-btn prev" aria-label="Önceki proje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="stage">
      ${P.items.map((p,k)=>`<article class="pcard" data-k="${k}">
        ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
        <h3>${p.name}</h3>
        ${p.tagline ? `<div class="tagline">${p.tagline}</div>` : ''}
        <p>${p.description}</p>
        ${(p.tech||[]).length ? `<div class="tech">${p.tech.map(t=>`<span>${t}</span>`).join('')}</div>` : ''}
        ${(p.steps||[]).length ? `<div class="layers-title">${p.stepsTitle||'Nasıl çalışıyor?'}</div>
          <div class="layers">${p.steps.map((l,i)=>`<button class="layer${i?'':' on'}" data-i="${i}">${i+1}. ${l.name}</button>`).join('')}</div>
          <p class="layer-detail">${p.steps[0].detail}</p>` : ''}
        ${p.link ? `<a class="more" ${ext(p.link)}>Projeyi incele →</a>` : ''}
      </article>`).join('')}
    </div>
    <button class="arrow-btn next" aria-label="Sonraki proje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="dots">${P.items.map((_,k)=>`<button aria-label="Proje ${k+1}" data-k="${k}"></button>`).join('')}</div>
</div></section>

<section id="yetenekler"><div class="wrap sec-grid fade">
  <h2>${SITE.skillsTitle}</h2>
  <div class="skills">${SITE.skills.map(g=>`<div><h5>${g.group}</h5><ul>${g.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
</div></section>

<section id="iletisim" class="contact"><div class="wrap fade">
  <h2>${C.title}</h2>
  <p>${C.description}</p>
  <a class="email" href="mailto:${C.email}">${C.email}</a>
  <div class="socials">${C.links.map(l=>`<a ${ext(l.url)}>${ICONS[l.icon]||''}${l.text}</a>`).join('')}</div>
</div></section>

<footer><div class="wrap">${C.footer}</div></footer>`;

// project step buttons (inside each card)
document.querySelectorAll('.pcard').forEach(card => {
  const p = P.items[card.dataset.k];
  card.querySelectorAll('.layer').forEach(b => b.onclick = () => {
    card.querySelectorAll('.layer').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    card.querySelector('.layer-detail').textContent = p.steps[b.dataset.i].detail;
    fitStage();
  });
});

// carousel: center card sharp, neighbours blurred behind
const cards = [...document.querySelectorAll('.pcard')], dots = [...document.querySelectorAll('.dots button')];
const stage = $('.stage'), n = cards.length;
let cur = 0;
function rel(k){ let d = k - cur; if (n > 2) { if (d > n/2) d -= n; if (d < -n/2) d += n; } return d; }
function layout(){
  const mobile = innerWidth < 720, shift = mobile ? 58 : 72;
  cards.forEach((c,k) => {
    const d = rel(k), ad = Math.abs(d);
    c.classList.toggle('side', ad === 1);
    c.classList.toggle('hidden', ad > 1);
    c.style.zIndex = 10 - ad;
    c.style.transform = `translateX(calc(-50% + ${Math.max(-2, Math.min(2, d))*shift}%)) scale(${ad ? .84 : 1})`;
    c.style.filter = ad ? 'blur(3px)' : 'none';
    c.style.opacity = ad === 0 ? 1 : ad === 1 ? .55 : 0;
    c.setAttribute('aria-hidden', ad ? 'true' : 'false');
  });
  dots.forEach((b,k) => b.classList.toggle('on', k === cur));
  fitStage();
}
function fitStage(){ stage.style.height = Math.max(...cards.map(c => c.offsetHeight)) + 'px'; }
function go(k){ cur = (k + n) % n; layout(); }
$('.arrow-btn.prev').onclick = () => go(cur - 1);
$('.arrow-btn.next').onclick = () => go(cur + 1);
dots.forEach(b => b.onclick = () => go(+b.dataset.k));
cards.forEach((c,k) => c.addEventListener('click', () => { if (c.classList.contains('side')) go(k); }));
document.addEventListener('keydown', e => {
  const r = stage.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});
let tx = null;
stage.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
stage.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
addEventListener('resize', layout);
document.fonts && document.fonts.ready.then(fitStage);
layout();

// fade-in on scroll
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), { threshold: .12 });
document.querySelectorAll('.fade').forEach((el, i) => {
  el.style.transitionDelay = el.closest('.hero') ? (i * 90) + 'ms' : '0ms';
  io.observe(el);
});
</script>
</body>
</html>
